<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Fundo -->
  <rect width="100" height="100" rx="20" fill="#090B10"/>
  <!-- Borda Externa (Gótica) -->
  <path d="M 50 10 L 90 30 L 90 70 L 50 90 L 10 70 L 10 30 Z" fill="none" stroke="#263344" stroke-width="2"/>
  <!-- Letra N (Ciano e Prata) -->
  <path d="M 30 70 L 30 30 L 70 70 L 70 30" fill="none" stroke="#C3CBD5" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Detalhe Central (Ciano Elétrico) -->
  <circle cx="50" cy="50" r="8" fill="#00D2FF"/>
  <!-- Linha de varredura (Y2K/Cyber) -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#00D2FF" stroke-width="1" opacity="0.5"/>
</svg>
